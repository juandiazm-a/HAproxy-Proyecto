
services:
  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - app-net

  backend1:
    build: ./backend
    container_name: backend1
    networks:
      - app-net

  backend2:
    build: ./backend
    container_name: backend2
    networks:
      - app-net

  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend1
      - backend2
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
